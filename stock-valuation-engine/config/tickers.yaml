          - SU.PA        # core -- Schneider Electric, Paris listing
          - ETN          # core -- Eaton Corp
          - GEV          # core -- GE Vernova
          - CEG          # core -- Constellation Energy (clean baseload for data centers)
          - PWR          # core -- Quanta Services (grid EPC)
          - PRY.MI       # core -- Prysmian (HV / subsea cabling)
          - 5803.T       # core -- Fujikura (optical + power cabling for AI DCs) -- verify (grid showed "FUWAY" OTC ADR)
          - VRT          # core -- Vertiv Holdings (DC power & liquid cooling)
          - AGX          # core -- Argan (power-generation EPC)
          - LIN          # satellite -- Linde plc
          - NVT          # satellite -- nVent Electric
          - PH           # satellite -- Parker-Hannifin (moved here from E&C Layer 3: motion control is electrification)
          - BE           # satellite -- Bloom Energy
      - name: "Layer 3: Water & Environmental"
        weight: 0.10
        thesis: >
          Water scarcity and waste oligopolies: smart metering, treatment,
          process chemistry, waste duopoly, niche desalination.
        tickers:
          - XYL          # core -- Xylem Inc
          - ECL          # core -- Ecolab
          - WM           # core -- Waste Management
          - RSG          # core -- Republic Services
          - CWCO         # satellite -- Consolidated Water Co
          - BMI          # satellite -- Badger Meter (smart water metering)
      - name: "Layer 4: Cyber, Networking & Edge"
        weight: 0.15
        thesis: >
          Zero-trust perimeter and AI-factory networking: switching, platform
          security, identity; broadband-access satellites.
        tickers:
          - ANET         # core -- Arista Networks
          - PANW         # core -- Palo Alto Networks (moved here from AI/SEMIS Layer 3: cyber consolidated)
          - CRWD         # core -- CrowdStrike (either/or RESOLVED: kept over ZS)
          - FTNT         # core -- Fortinet (either/or RESOLVED: kept over CHKP)
          - OKTA         # core -- Okta (identity)
          - ADTN         # satellite -- Adtran Holdings
          - CALX         # satellite -- Calix
          - HLIT         # satellite -- Harmonic
          - CHKP       # alternative to FTNT, pair resolved
          - ZS         # alternative to CRWD, pair resolved

