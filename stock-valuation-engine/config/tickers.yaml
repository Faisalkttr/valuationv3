# Watchlist config, structured to match the reorganized & tightened allocation grid:
#   Section (target % of portfolio)
#     -> Layer / Category (weight within the section)
#       -> tickers, in Yahoo Finance format, with thesis kept as a comment
#
# NOTES / THINGS TO VERIFY before running the engine:
# - CONVENTION: tickers tagged "# core" are conviction holdings (sized first);
#   tickers tagged "# satellite" are half-size positions that must re-earn their
#   slot each review. Tags are comments only -- the engine weights by layer
#   unless explicit per-ticker weights are given (see Overlay).
# - EITHER/OR PAIRS FROM THE OLD GRID ARE RESOLVED: FTNT kept over CHKP,
#   CRWD kept over ZS. Deleted alternatives remain as commented-out lines.
# - CUTS / MOVES from the old grid are kept as commented-out lines with reasons
#   (CVX, COP, NUE cut; PH and PANW moved to INFRA).
# - Exchange-listed/ambiguous symbols are mapped to a best-guess Yahoo Finance
#   ticker (marked "# verify"). yfinance will simply fail that single ticker
#   (and get skipped, not crash the run) if a symbol is wrong -- check the
#   Actions log or run `python -m engine.run` locally and fix any misses.
# - Section targets now sum to 100%: 14+18+10+7+6 (equity sleeves) plus
#   25 BTC + 10 GOLD + 10 CASH. The cropped BTC/GOLD/CASH rows were added.
# - "XOM (Light Only)" is kept as an inline comment: it is a position-sizing
#   note, not part of the ticker symbol.
history_years: 5
price_lookup_tolerance_days: 5
sections:
  - name: INFRA
    target_pct: 0.14
    layers:
      - name: "Layer 1: Hard Assets & Global Freight"
        weight: 0.35
        thesis: >
          Perpetual tolls on physical commerce: Class I rail networks, port
          monopolies, Jones Act maritime shipping, and global freight
          forwarding / contract logistics integration.
        tickers:
          - TPL          # core -- Texas Pacific Land Corp
          - ADPORTS.AD   # core -- Abu Dhabi Ports Group -- verify (ADX listing)
          - ICTEY        # core -- International Container Terminal Services ADR -- verify (grid showed "ICTEY")
          - CNI          # core -- Canadian National Railway
          - CP           # core -- Canadian Pacific Kansas City
          - UNP          # core -- Union Pacific
          - MATX         # core -- Matson (Jones Act maritime)
          - DSV.CO       # core -- DSV A/S (global freight forwarding / contract logistics)
      - name: "Layer 2: Electrification, Grid & AI-Power Build"
        weight: 0.40
        thesis: >
          The full electrification stack: grid OEMs, generation equipment,
          clean nuclear baseload, build-out EPC, HV/optical cabling for AI
          factories, data-center power/cooling, motion control and gases.
        tickers:
