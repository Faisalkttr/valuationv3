name: Refresh valuation data

on:
  workflow_dispatch: # Enables the manual "Run workflow" button in the Actions tab
  schedule:
    - cron: '0 18 * * 1-5' # Weekdays at 18:00 UTC

permissions:
  contents: write # Needed so this workflow can push the refreshed data back

jobs:
  run-valuation-engine:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Step 3: Install project dependencies from the subfolder
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd stock-valuation-engine
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run your valuation engine script from the correct working directory
      - name: Execute valuation engine
        run: |
          cd stock-valuation-engine
          python engine/run.py
        env:
          PYTHONPATH: .

      # Step 5: Commit and push back any data changes generated by the engine
      - name: Commit updated valuation data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-refresh valuation data [skip ci]" && git push)
